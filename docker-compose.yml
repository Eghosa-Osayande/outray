version: "3.9"

services:


  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  tiger-data:
    image: timescale/timescaledb:latest-pg15
    container_name: tiger-data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - tiger_data_volume:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  migrations:
    image: postgres:15-alpine
    working_dir: /root/outray
    volumes:
      - ./deploy/:/root/outray/deploy/:ro
    depends_on:
      redis:
        condition: service_started
      tiger-data:
        condition: service_healthy
      postgres:
        condition: service_healthy  
    command: >
      sh -c "
        echo "🐯 Running Tiger Data migrations..."
        psql "${TIGER_DATA_URL}" -f deploy/setup_tigerdata.sql
        if [ -n "${TIGER_DATA_URL}" ]; then
          for migration in deploy/migrations/*.sql; do
            if [ -f "$$migration" ]; then
              echo "  Running $$migration...";
              psql "${TIGER_DATA_URL}" -f "$$migration" || echo "❌ Failed: $$migration";
            fi;
          done;
          echo "✅ Tiger Data migrations complete.";
        else
          echo "⚠️ TIGER_DATA_URL not set, skipping migrations.";
        fi
      "

  tunnel:
    build: 
      context: .
    command: ["node", "apps/tunnel/dist/server.js"]
    ports:
      - "3547:3547"
      - "20000:20000"
      - "20001:20001"
      - "30000:30000" 
      - "30001:30001" 
    environment:
      # Server Configuration
      PORT: 3547
      BASE_DOMAIN: localhost.direct

      # Redis
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      REDIS_TUNNEL_TTL_SECONDS: 120
      REDIS_HEARTBEAT_INTERVAL_MS: 20000

      # Request Settings
      REQUEST_TIMEOUT_MS: 60000

      # TCP/UDP Port Ranges
      TCP_PORT_RANGE_MIN: 20000
      TCP_PORT_RANGE_MAX: 20001
      UDP_PORT_RANGE_MIN: 30000
      UDP_PORT_RANGE_MAX: 30001

      # Web API URL
      WEB_API_URL: http://web:3000/api

      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      redis:
        condition: service_started
      tiger-data:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  internal-check:
    build: 
      context: .
    command: ["node", "apps/internal-check/dist/index.js"]
    ports:
      - "3001:3001"
    environment:
      # Server Port
      PORT: 3001

    depends_on:
      tunnel:
        condition: service_started

  cron:
    build: 
      context: .
    command: ["node", "apps/cron/dist/index.js"]
    environment:
      # Redis
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      
    depends_on:
      tunnel:
        condition: service_started

  web:
    build: 
      context: .
    working_dir: /apps/web
    # command: ["node", "web/.output/server/index.mjs"]
    command: >
      sh -c "
        echo 'Running Better Auth CLI...'
        npx drizzle-kit push || true
        echo 'Starting web server...'
        node .output/server/index.mjs
      "
    ports:
      - "3000:3000"
    environment:
      # App
      APP_URL: http://localhost:3000

      # Better Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}

      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Zepto Mail
      ZEPTO_API_KEY: ${ZEPTO_API_KEY}

      # Redis (container name, not localhost)
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}

      # Polar
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET}
      POLAR_SERVER: ${POLAR_SERVER}

      # Polar Products
      POLAR_PRODUCT_RAY: ${POLAR_PRODUCT_RAY}
      POLAR_PRODUCT_BEAM: ${POLAR_PRODUCT_BEAM}

      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

    depends_on:
      tunnel:
        condition: service_started
      


volumes:
  postgres_data:
  tiger_data_volume:
